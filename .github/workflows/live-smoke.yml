name: Live smoke test

# Weekly check that itch.io and OpenGameArt markup still parses. Kept off PRs
# to avoid sending the sites traffic for every contribution.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Live smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Search, inspect and download against the real sites
        run: uv run --script smoke.py
