[project]
name = "game-asset-finder"
version = "0.2.0"
description = "MCP server for finding free 2D game assets on itch.io and OpenGameArt"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Keep in sync with the inline script metadata in server.py (checked by tests).
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "beautifulsoup4>=4.12"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
